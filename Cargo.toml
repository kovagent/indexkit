[workspace]
resolver = "2"

members = [
    "crates/indexkit",
    "cli",
]

[workspace.package]
version = "1.0.1"
edition = "2021"
authors = ["userFRM"]
license = "Apache-2.0"
repository = "https://github.com/userFRM/indexkit"
documentation = "https://docs.rs/indexkit"

[workspace.dependencies]
# -- Core --
anyhow = "1.0.102"
thiserror = "2.0.18"

# -- Async runtime --
tokio = { version = "1.52.1", features = ["full"] }

# -- Serialization --
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# -- Logging --
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# -- Time --
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"

# -- Async utilities --
async-trait = "0.1.89"

# -- HTTP --
reqwest = { version = "0.13.2", features = ["json", "rustls"], default-features = false }
bytes = "1.11.1"
futures = "0.3.32"

# -- Crypto --
sha2 = "0.11.0"

# -- Parquet / Arrow --
arrow = { version = "58.1.0", default-features = false, features = ["csv"] }
parquet = { version = "58.1.0", default-features = false, features = ["snap", "zstd", "arrow"] }

# -- XML (N-PORT primary_doc.xml parsing) --
quick-xml = "0.39.2"

# -- CLI --
clap = { version = "4.6.1", features = ["derive", "env"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
