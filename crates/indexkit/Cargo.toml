[package]
name = "indexkit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Daily index constituents for the S&P 500, S&P 400/600, Nasdaq-100 and Dow Jones, for Rust"
keywords = ["index", "constituents", "sp500", "nasdaq100", "finance"]
categories = ["finance", "api-bindings"]
readme = "../../README.crates.md"
exclude = [
    "/data",
    "/docs",
    "/.github",
    "/cli",
    "tests/fixtures",
]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
async-trait.workspace = true
reqwest.workspace = true
arrow.workspace = true
parquet.workspace = true
bytes.workspace = true
futures.workspace = true
sha2.workspace = true
quick-xml.workspace = true
calamine.workspace = true
directories = "6"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
wiremock = "0.6"
