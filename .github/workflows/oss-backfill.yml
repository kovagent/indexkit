name: oss-backfill
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which OSS GitHub mirror to ingest (fja05680 / yfiua / hanshof). Leave blank for all."
        required: false

jobs:
  oss-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --bin indexkit-cli
      - name: Github backfill
        run: |
          if [ -n "${{ github.event.inputs.source }}" ]; then
            ./target/release/indexkit-cli github-backfill --source "${{ github.event.inputs.source }}"
          else
            ./target/release/indexkit-cli github-backfill
          fi
      - name: Regenerate manifest
        run: ./target/release/indexkit-cli manifest
      - name: Commit data
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add data/
          git diff --cached --quiet || git commit -m "chore(data): oss-backfill via workflow_dispatch"
          git push
