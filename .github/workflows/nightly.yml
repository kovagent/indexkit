name: nightly
on:
  schedule:
    # 12:00 UTC Mon-Fri = 08:00 ET (EDT) / 07:00 ET (EST).
    # AFTER ETF sponsors publish daily holdings (~06:00 ET) and SEC N-PORT
    # filings have settled overnight. Previous "0 7 * * 1-5" was 03:00 ET
    # — too early for sponsor CDN.
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      INDEXKIT_SEC_USER_AGENT: "indexkit ${{ secrets.CONTACT_EMAIL || 'frederic.miesegaes@gmail.com' }}"
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --bin indexkit-cli
      - name: SEC N-PORT nightly walk
        run: ./target/release/indexkit-cli nightly-append
        continue-on-error: true
      - name: Sponsor CDN daily fetch
        run: ./target/release/indexkit-cli daily-fetch --accept-sponsor-tos
        continue-on-error: true
      - name: GitHub mirrors sync
        run: ./target/release/indexkit-cli github-backfill
        continue-on-error: true
      - name: Regenerate manifest
        run: ./target/release/indexkit-cli manifest
      - name: Show data status
        run: |
          for d in sp500 sp400 sp600 ndx dji; do
            count=$(ls data/$d/ 2>/dev/null | wc -l)
            latest=$(ls data/$d/ 2>/dev/null | tail -1)
            echo "$d: $count files (latest: $latest)"
          done
      - name: Commit if changed
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): nightly $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no changes to commit"
          fi
